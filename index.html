<!doctype html>
<html lang="fr" data-dir="a">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- C1 — circuit fermé. L'essai reste à 10 € sur tout le réseau ;
     cette page vit uniquement sur QR et campagnes, et ne doit jamais être trouvable. -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />

<title>Ta séance d'essai est offerte — Boxing Center</title>
<meta name="description" content="Une séance d'essai Boxing Center, habituellement à 10 €, offerte. Débutants acceptés, matériel prêté, aucune obligation d'inscription. Cinq salles à Toulouse." />
<meta name="theme-color" content="#080808" />
<meta name="color-scheme" content="dark" />

<!-- Le §3 du cahier des charges liste WhatsApp et les campagnes Meta parmi les
     sources de trafic : sans aperçu, un lien partagé arrive nu et ne se clique pas. -->
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta property="og:site_name" content="Boxing Center" />
<meta property="og:title" content="Ta séance d'essai Boxing Center est offerte" />
<meta property="og:description" content="Habituellement à 10 €, offerte sur ce lien. Débutants acceptés, matériel prêté, cours encadré, aucune obligation d'inscription. Cinq salles à Toulouse." />
<meta property="og:image" content="/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Un coach Boxing Center accompagne une adhérente au sac. Séance d'essai à 0 € au lieu de 10 €." />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
<link rel="apple-touch-icon" href="/favicon-192.png" />

<!-- L'image du héros est l'élément le plus grand du premier écran : sans
     préchargement, le navigateur ne la découvre qu'après avoir exécuté le
     script qui la pose. C'est la direction A par défaut. -->
<link rel="preload" as="image" href="/img/coin-640.webp"
      imagesrcset="/img/coin-380.webp 380w, /img/coin-520.webp 520w, /img/coin-640.webp 640w, /img/coin-900.webp 900w, /img/coin-1100.webp 1100w, /img/coin-1537.webp 1537w" imagesizes="100vw" fetchpriority="high" />

<link rel="preload" as="font" type="font/woff2" href="/fonts/bebas-neue-400-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-400-latin.woff2" crossorigin />
</head>

<body>
  <a class="skip" href="#formulaire">Aller au formulaire</a>

  <!-- La lumière du coin : un objet suspendu au-dessus de la page, pas un fond. -->
  <div class="light" aria-hidden="true"><canvas class="light__dust"></canvas></div>

  <div class="bellflash" aria-hidden="true"></div>

  <!-- La pancarte du speaker : elle passe au changement de round. -->
  <div class="pancarte" id="annonce-round" aria-hidden="true">
    <span class="pancarte__r">Round</span>
    <span class="pancarte__n">01</span>
    <span class="pancarte__l">L'offre</span>
  </div>

  <!-- Plein écran pour l'affiche officielle : elle est dense, elle doit
       pouvoir se lire en grand sans quitter la page. -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Planning en grand" hidden></div>
  <div id="rail-slot"></div>

  <main id="app"></main>

  <!-- Toute la page est montée par script : sans lui, il ne reste rien.
       Ce bloc ne remplace pas la page, il évite l'écran noir et dit au
       visiteur ce qu'il est venu chercher. -->
  <noscript>
    <div class="noscript">
      <p class="noscript__eyebrow">Boxing Center</p>
      <h1 class="noscript__titre">Ta séance d'essai est offerte.</h1>
      <p class="noscript__prix"><s>10 €</s> <b>0 €</b></p>
      <p>La séance d'essai est à 10 € toute l'année, dans les cinq salles de
         Toulouse. Sur ce lien, elle t'est offerte.</p>
      <p>Débutants acceptés · matériel prêté · cours encadré ·
         sans obligation d'inscription.</p>
      <p class="noscript__aide">Cette page a besoin de JavaScript pour
         enregistrer ton inscription. Active-le et recharge, ou présente-toi
         directement à l'accueil d'une des salles.</p>
    </div>
  </noscript>

  <!-- Barre collante : +11 à +20,4 % mesurés. 64 % des mobiles ne dépassent pas le 1er écran. -->
  <div class="dock" id="dock">
    <div class="dock__in">
      <div class="dock__state">
        <span class="dock__price"><s>10 €</s><b>0 €</b></span>
        <span class="dock__meta" id="dock-meta">2 min · sans engagement</span>
      </div>
      <button type="button" class="btn btn--primary dock__cta" data-open-form>
        Je réserve ma séance<span class="btn__arrow" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
